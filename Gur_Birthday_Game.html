<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5C94FC">
<title>הטיפוס של גור ליום ההולדת!</title>
<style>
  :root{
    /* Mario-style palette */
    --sky1:#8FC0FF;--sky2:#5C94FC;--brick:#C85A20;--brick2:#E8843C;
    --vine:#3AA630;--gold:#FBD000;--red:#E52521;--blue:#049CD8;--ink:#3a2200;--ui:#FBD000;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#1a3c8c;
    font-family:-apple-system,"Segoe UI","Arial Hebrew",Arial,system-ui,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;height:100%;aspect-ratio:460/720;max-width:100vw;}
  canvas{display:block;width:100%;height:100%;
    background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 60%, #4a7fe0 100%);
    touch-action:none;border-radius:8px;}

  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 14px;font-weight:800;color:#fff;font-size:clamp(14px,3.6vw,20px);
    text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none;z-index:4;}
  #lives{color:#ff5a5a;}#timer{color:#fff;}#coins{color:#FBD000;}

  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at center, rgba(92,148,252,.88), rgba(16,34,80,.96));}
  .screen h1{font-weight:800;font-size:clamp(30px,8vw,56px);line-height:1.08;
    background:linear-gradient(180deg,var(--gold),var(--red));-webkit-background-clip:text;
    background-clip:text;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.7);}
  .screen p{font-weight:500;color:#fff;font-size:clamp(15px,4vw,20px);max-width:340px;}
  .key{display:inline-block;background:#fff;color:var(--ink);border-radius:6px;
    padding:1px 8px;font-weight:700;margin:0 1px;box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .btn{font-family:inherit;font-weight:800;font-size:18px;border:none;cursor:pointer;
    color:#fff;background:linear-gradient(180deg,var(--red),#a81810);
    border-radius:999px;padding:13px 30px;box-shadow:0 6px 0 rgba(0,0,0,.35);}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35);}
  .hidden{display:none!important;}

  /* fullscreen toggle */
  #fsBtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:8;
    background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);
    color:#fff;font-family:inherit;font-weight:700;font-size:13px;
    padding:5px 12px;border-radius:999px;cursor:pointer;}
  #fsBtn:active{background:rgba(255,255,255,.35);}

  #touch{position:absolute;inset:0;z-index:6;display:none;}
  .pad{position:absolute;bottom:26px;width:92px;height:92px;border-radius:50%;
    background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;
    font-weight:800;user-select:none;backdrop-filter:blur(2px);}
  .pad:active{background:rgba(255,255,255,.38);transform:scale(.94);}
  /* left thumb: left / right */
  #bLeft{left:16px;bottom:26px;}
  #bRight{left:120px;bottom:26px;}
  /* right thumb: up / down stacked, jump big below */
  #bUp{right:120px;bottom:128px;}
  #bDown{right:120px;bottom:26px;}
  #bJump{right:14px;bottom:62px;width:104px;height:104px;font-size:18px;
    background:rgba(126,242,154,.32);border-color:rgba(126,242,154,.75);}
  @media (pointer:coarse){#touch{display:block;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="460" height="720"></canvas>
  <div id="hud">
    <span><span id="lives">❤❤❤</span> &nbsp; <span id="coins">🪙 0</span></span>
    <span id="timer">🎂 לטפס למעלה!</span>
  </div>
  <button id="fsBtn">⛶ מסך מלא</button>

  <div id="touch" class="hidden">
    <div class="pad" id="bLeft">◀</div>
    <div class="pad" id="bRight">▶</div>
    <div class="pad" id="bUp">▲</div>
    <div class="pad" id="bDown">▼</div>
    <div class="pad" id="bJump">קפיצה</div>
  </div>

  <div class="screen" id="start">
    <h1>הטיפוס של גור<br>ליום ההולדת!</h1>
    <p>עזרו לגור הקטן לטפס עד למעלה ולהגיע לעוגת יום ההולדת! 🎂<br><br>
       קפצו מעל הקאפקייקס המתגלגלים 🧁 וטפסו על הסולמות.</p>
    <p style="font-size:14px">תנועה <span class="key">◀</span><span class="key">▶</span> &nbsp; טיפוס <span class="key">▲</span><span class="key">▼</span> &nbsp; קפיצה <span class="key">רווח</span></p>
    <button class="btn" id="startBtn">להתחיל! 🚀</button>
  </div>

  <div class="screen hidden" id="over">
    <h1>אופס!</h1>
    <p>גור נתקל בקאפקייקס. נסו שוב — העוגה מחכה!</p>
    <button class="btn" id="retryBtn">לנסות שוב</button>
  </div>

  <!-- win: transparent so the canvas cake shows through; only the button is clickable -->
  <div id="win" class="hidden" style="position:absolute;inset:0;z-index:10;pointer-events:none;
       display:flex;align-items:flex-end;justify-content:center;">
    <button class="btn hidden" id="playAgain" style="pointer-events:auto;margin-bottom:34px;">לשחק שוב 🎉</button>
  </div>
</div>

<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=460,H=720;
let state='start',lives=3,raf=null;

/* ---------- SOUND: "whee!" cheer ---------- */
let audioCtx=null;
function initAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function cheer(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  [523,659,784,1047].forEach((f,i)=>{   // C5 E5 G5 C6 — quick happy arpeggio
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
    const st=t+i*0.06,d=0.13;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.2,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,st+d);
    o.start(st);o.stop(st+d);
  });
  const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();  // upward "whoop" slide
  o2.type='sine';o2.connect(g2);g2.connect(audioCtx.destination);
  o2.frequency.setValueAtTime(450,t);o2.frequency.exponentialRampToValueAtTime(1300,t+0.26);
  g2.gain.setValueAtTime(0.0001,t);g2.gain.linearRampToValueAtTime(0.1,t+0.03);
  g2.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o2.start(t);o2.stop(t+0.32);
}
/* floating "יש!" text */
let floats=[];
function popText(txt){floats.push({x:P.x+P.w/2,y:P.y-6,txt,life:50});}

/* candle blow-out "whoosh" */
function blowSound(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime,dur=0.5;
  const buf=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*dur),audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const f=audioCtx.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(1600,t);f.frequency.exponentialRampToValueAtTime(300,t+dur);
  const g=audioCtx.createGain();g.gain.setValueAtTime(0.45,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start(t);src.stop(t+dur);
}

/* ---------- LEVEL LAYOUT ---------- */
const SURF=[120,230,340,450,560,680];      // 0=top(cake) .. 5=ground
const PLAT_L=20, PLAT_R=440, PLAT_H=14;
const LADDERS=[
  {x:300, top:SURF[0], bot:SURF[1]},
  {x:90,  top:SURF[1], bot:SURF[2]},
  {x:380, top:SURF[2], bot:SURF[3]},
  {x:90,  top:SURF[3], bot:SURF[4]},
  {x:380, top:SURF[4], bot:SURF[5]},
];
const FALLSIDE=[1,-1,1,-1,1];              // present zig-zag edge per row
const cake={x:250,y:SURF[0]-46,w:54,h:46};

/* ---------- PLAYER ---------- */
const P={x:0,y:0,w:26,h:36,vx:0,vy:0,onGround:false,climbing:false,face:1,anim:0};
function resetPlayer(){P.x=40;P.y=SURF[5]-P.h;P.vx=0;P.vy=0;P.onGround=true;P.climbing=false;P.face=1;}

/* ---------- INPUT ---------- */
const keys={left:false,right:false,up:false,down:false,jump:false};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump'};
addEventListener('keydown',e=>{if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=true;e.preventDefault();}});
addEventListener('keyup',e=>{if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=false;e.preventDefault();}});
function bindPad(id,k){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=true;};const off=e=>{e.preventDefault();keys[k]=false;};
  el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);}
['bLeft','left','bRight','right','bUp','up','bDown','down','bJump','jump']
  .reduce((a,v,i)=>{if(i%2===0)a.push(v);else bindPad(a.pop(),v);return a;},[]);

/* ---------- COINS / SCORE ---------- */
let coins=[],score=0;
function updateCoins(){const el=document.getElementById('coins');if(el)el.textContent='🪙 '+score;}
function initCoins(){
  score=0;updateCoins();coins=[];
  const spots=[
    [150,5],[250,5],[330,5],
    [60,4],[200,4],[300,4],
    [150,3],[250,3],[330,3],
    [60,2],[200,2],[300,2],
    [150,1],[250,1],[330,1]
  ];
  for(const [x,r] of spots) coins.push({x,y:SURF[r]-18,taken:false,phase:Math.random()*6.28});
}
function coinSound(){
  if(!audioCtx)return;const t=audioCtx.currentTime;let st=t;
  for(const [fr,d] of [[988,0.06],[1319,0.13]]){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.value=fr;o.connect(g);g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(0.16,st+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,st+d);
    o.start(st);o.stop(st+d);st+=d*0.55;
  }
}
function collectCoins(){
  for(const c of coins){
    if(c.taken)continue;c.phase+=0.15;
    if(Math.abs((P.x+P.w/2)-c.x)<14 && Math.abs((P.y+P.h/2)-c.y)<18){
      c.taken=true;score++;updateCoins();coinSound();popText('+1');
    }
  }
}
function drawCoins(){
  for(const c of coins){
    if(c.taken)continue;
    const w=Math.abs(Math.cos(c.phase))*7+1.2;     // spinning width
    ctx.fillStyle='#FBD000';ctx.beginPath();ctx.ellipse(c.x,c.y,w,8,0,0,7);ctx.fill();
    ctx.strokeStyle='#c79100';ctx.lineWidth=1.5;ctx.stroke();
    if(w>3){ctx.fillStyle='#fff4b8';ctx.beginPath();ctx.ellipse(c.x,c.y,w*0.45,4,0,0,7);ctx.fill();}
  }
}

/* ---------- PRESENTS ---------- */
let presents=[],spawnTimer=0;
const PSIZE=32,PSPEED=1.0,PFALL=2.6;
const PCOL=['#E52521','#43B047','#049CD8','#FBD000','#FF8C00'];
function spawnPresent(){presents.push({x:cake.x,y:SURF[0]-PSIZE,row:0,vx:FALLSIDE[0]*PSPEED,falling:false,c:Math.floor(Math.random()*5),spin:0,passed:false});}
function updatePresents(){
  spawnTimer--;
  if(spawnTimer<=0){spawnPresent();spawnTimer=110+Math.random()*70;}
  for(let i=presents.length-1;i>=0;i--){
    const p=presents[i];p.spin+=p.vx*0.12;
    if(p.falling){
      p.y+=PFALL;const nextSurf=SURF[p.row+1];
      if(p.y+PSIZE>=nextSurf){p.y=nextSurf-PSIZE;p.row++;p.falling=false;
        if(p.row>=SURF.length-1)p.vx=(p.x<W/2?PSPEED:-PSPEED);
        else p.vx=FALLSIDE[p.row]*PSPEED;}
    }else{
      p.x+=p.vx;
      if(p.row<FALLSIDE.length){
        const side=FALLSIDE[p.row];
        if(side>0 && p.x+PSIZE>=PLAT_R){p.x=PLAT_R-PSIZE;p.falling=true;}
        else if(side<0 && p.x<=PLAT_L){p.x=PLAT_L;p.falling=true;}
      }else if(p.x<-PSIZE||p.x>W+PSIZE){presents.splice(i,1);continue;}
    }
    if(state==='play'){
      const overlapX = p.x < P.x+P.w && p.x+PSIZE > P.x;
      // cheer + bonus coin when Gur jumps over a cupcake (above it) on roughly the same level
      if(!p.passed && overlapX && (P.y+P.h) < p.y+8 && (p.y-(P.y+P.h)) < 64){
        p.passed=true; cheer(); popText('יש! +1'); score++; updateCoins();
      }
      // collision = bump
      if(p.x<P.x+P.w-3 && p.x+PSIZE>P.x+3 && p.y<P.y+P.h-2 && p.y+PSIZE>P.y+4){loseLife();return;}
    }
  }
}

/* ---------- PHYSICS ---------- */
const GRAV=0.6, MOVE=2.6, JUMP=-9.6;
// pick the ladder lined up with Gur's x whose vertical span contains his feet
function nearLadder(){
  const cx=P.x+P.w/2, feet=P.y+P.h;
  for(const L of LADDERS){
    if(Math.abs(cx-L.x)<16 && feet>=L.top-4 && feet<=L.bot+8) return L;
  }
  return null;
}
function update(){
  if(keys.left){P.vx=-MOVE;P.face=-1;} else if(keys.right){P.vx=MOVE;P.face=1;} else P.vx=0;
  const L=nearLadder();const feet=P.y+P.h;
  if(L && !P.climbing){
    // climb UP if standing on/near the ladder's lower part; climb DOWN if standing at its top
    if(keys.up && feet>L.top+4)P.climbing=true;
    else if(keys.down && Math.abs(feet-L.top)<8)P.climbing=true;
  }
  if(P.climbing){
    const lad=L||nearLadder();
    if(!lad){P.climbing=false;}
    else{
      P.x=lad.x-P.w/2;P.vx=0;P.vy=0;
      if(keys.up)P.y-=2.4; if(keys.down)P.y+=2.4;
      const topLimit=lad.top-P.h, botLimit=lad.bot-P.h;
      if(P.y<=topLimit){P.y=topLimit;P.climbing=false;P.onGround=true;}
      if(P.y>=botLimit){P.y=botLimit;P.climbing=false;P.onGround=true;}
      if(keys.jump){P.climbing=false;P.vy=JUMP*0.7;P.onGround=false;}
      P.anim+=0.2;
    }
  }else{
    P.vy+=GRAV;if(P.vy>12)P.vy=12;
    P.x+=P.vx;P.y+=P.vy;
    if(P.x<PLAT_L)P.x=PLAT_L;if(P.x+P.w>PLAT_R)P.x=PLAT_R-P.w;
    P.onGround=false;
    for(const s of SURF){
      if(P.vy>=0 && (P.y+P.h)>=s && (P.y+P.h)<=s+P.vy+2 && (P.x+P.w/2)>PLAT_L-4 && (P.x+P.w/2)<PLAT_R+4){
        P.y=s-P.h;P.vy=0;P.onGround=true;}
    }
    if(P.onGround && keys.jump){P.vy=JUMP;P.onGround=false;}
    if(P.vx!==0)P.anim+=0.25;
  }
  if(P.x+P.w>cake.x && P.x<cake.x+cake.w && P.y+P.h>cake.y && P.y<cake.y+cake.h)winGame();
  collectCoins();
  updatePresents();
}
function loseLife(){lives--;updateHUD();if(lives<=0)gameOver();else{resetPlayer();presents=[];spawnTimer=60;}}
function updateHUD(){document.getElementById('lives').textContent=lives>0?'❤'.repeat(lives):'💔';}

/* ---------- DRAW HELPERS ---------- */
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPlatforms(){
  for(const s of SURF){
    ctx.fillStyle='#a8431a';rrect(PLAT_L,s,PLAT_R-PLAT_L,PLAT_H,4);ctx.fill();   // brick body
    ctx.fillStyle='#E8843C';rrect(PLAT_L,s,PLAT_R-PLAT_L,5,4);ctx.fill();        // lit top edge
    // brick mortar lines
    ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1.5;
    for(let x=PLAT_L+18;x<PLAT_R-6;x+=36){ctx.beginPath();ctx.moveTo(x,s+5);ctx.lineTo(x,s+PLAT_H);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(PLAT_L,s+5);ctx.lineTo(PLAT_R,s+5);ctx.stroke();
  }
  for(const L of LADDERS){
    ctx.strokeStyle='#2E8B27';ctx.lineWidth=4;     // green vine rails
    ctx.beginPath();ctx.moveTo(L.x-9,L.top);ctx.lineTo(L.x-9,L.bot+PLAT_H);
    ctx.moveTo(L.x+9,L.top);ctx.lineTo(L.x+9,L.bot+PLAT_H);ctx.stroke();
    ctx.strokeStyle='#43B047';ctx.lineWidth=3;      // rungs
    for(let y=L.top+10;y<L.bot+PLAT_H;y+=16){ctx.beginPath();ctx.moveTo(L.x-9,y);ctx.lineTo(L.x+9,y);ctx.stroke();}
  }
}
function drawCake(){
  const {x,y,w,h}=cake;
  ctx.fillStyle='#fff';rrect(x,y+18,w,h-18,5);ctx.fill();
  ctx.fillStyle='#8b5a2b';rrect(x+4,y+14,w-8,h-14,5);ctx.fill();
  ctx.fillStyle='#E52521';rrect(x+4,y+14,w-8,9,4);ctx.fill();
  ctx.fillStyle='#E52521';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x+12+i*11,y+24,4,0,7);ctx.fill();}
  ctx.fillStyle='#FBD000';ctx.fillRect(x+w/2-2,y-8,4,16);
  const fl=Math.sin(Date.now()/120)*1.2;
  ctx.fillStyle='#FF8C00';ctx.beginPath();ctx.ellipse(x+w/2+fl,y-12,3.5,6,0,0,7);ctx.fill();
  ctx.fillStyle='#FBD000';ctx.beginPath();ctx.ellipse(x+w/2+fl,y-11,1.8,3,0,0,7);ctx.fill();
}
function drawPresent(p){
  ctx.save();
  ctx.translate(p.x+PSIZE/2,p.y+PSIZE/2);
  ctx.rotate(Math.sin(p.spin)*0.22);          // gentle rock as it rolls
  ctx.scale(1.25,1.25);                        // drawing designed for ~26px, fill the 32px box
  const fro=PCOL[p.c];
  // paper wrapper (trapezoid) with stripes
  ctx.fillStyle='#E8C170';
  ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.lineTo(6,11);ctx.lineTo(-6,11);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,70,0,.35)';ctx.lineWidth=1.5;
  for(let i=-6;i<=6;i+=4){ctx.beginPath();ctx.moveTo(i,0.5);ctx.lineTo(i*0.7,11);ctx.stroke();}
  // frosting swirl
  ctx.fillStyle=fro;
  ctx.beginPath();ctx.moveTo(-10,0);
  ctx.quadraticCurveTo(-11,-7,-4,-8);
  ctx.quadraticCurveTo(-6,-13,0,-12);
  ctx.quadraticCurveTo(6,-13,4,-8);
  ctx.quadraticCurveTo(11,-7,10,0);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-3,-5,2.4,4,0.4,0,7);ctx.fill();
  // sprinkles
  ctx.fillStyle='#FBD000';ctx.fillRect(-5,-4,2,1.4);
  ctx.fillStyle='#fff';ctx.fillRect(3,-6,2,1.4);
  ctx.fillStyle='#049CD8';ctx.fillRect(0,-2,2,1.4);
  // cherry on top
  ctx.fillStyle='#E52521';ctx.beginPath();ctx.arc(0,-12,3,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(-1,-13,0.9,0,7);ctx.fill();
  ctx.restore();
}
function drawKid(){
  const h=P.h,f=P.face,climb=P.climbing;
  ctx.save();ctx.translate(P.x+P.w/2,P.y);ctx.scale(f,1);
  const sw=Math.sin(P.anim)*(climb?0:1);     // -1..1 walk phase
  const ls=sw*3;                              // leg swing px

  // soft ground shadow
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(0,h,10,3,0,0,7);ctx.fill();

  // LEGS (blue), alternating
  ctx.fillStyle='#0d6fb0';
  rrect(-6+ls, h-13, 5, 11, 2.5);ctx.fill();
  rrect( 1-ls, h-13, 5, 11, 2.5);ctx.fill();
  // SHOES (brown)
  ctx.fillStyle='#5a2d00';
  rrect(-7+ls, h-3, 7, 4, 2);ctx.fill();
  rrect( 0-ls, h-3, 7, 4, 2);ctx.fill();
  ctx.fillStyle='#3a1c00';rrect(-7+ls,h-1,7,2,1);ctx.fill();rrect(0-ls,h-1,7,2,1);ctx.fill();

  // BACK ARM (behind torso)
  ctx.fillStyle='#cf1f1c';
  ctx.save();ctx.translate(-6,h-23);ctx.rotate(climb?-0.7:(0.18 - sw*0.06));
  rrect(-2.4,0,4.8,10,2.4);ctx.fill();
  ctx.fillStyle='#ffcf9e';ctx.beginPath();ctx.arc(0,11,2.6,0,7);ctx.fill();ctx.restore();

  // TORSO — red tee
  ctx.fillStyle='#E52521';rrect(-8,h-25,16,16,6);ctx.fill();
  ctx.fillStyle='#c41f1c';rrect(-8,h-13,16,5,4);ctx.fill();           // shaded hem
  // overalls bib + buttons (blue)
  ctx.fillStyle='#049CD8';rrect(-6.5,h-20,13,12,3);ctx.fill();
  ctx.fillStyle='#0d6fb0';rrect(-6.5,h-24,3,5,1.5);ctx.fill();rrect(3.5,h-24,3,5,1.5);ctx.fill(); // straps
  ctx.fillStyle='#FBD000';ctx.beginPath();ctx.arc(-3.5,h-15,1.4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(3.5,h-15,1.4,0,7);ctx.fill();

  // FRONT ARM
  ctx.fillStyle='#E52521';
  ctx.save();ctx.translate(7,h-23);ctx.rotate(climb?0.7:(-0.18 + sw*0.06));
  rrect(-2.4,0,4.8,10,2.4);ctx.fill();
  ctx.fillStyle='#ffd9a8';ctx.beginPath();ctx.arc(0,11,2.7,0,7);ctx.fill();ctx.restore();

  // NECK
  ctx.fillStyle='#f0c49a';rrect(-3,h-28,6,4,2);ctx.fill();

  // HEAD
  ctx.fillStyle='#ffd9a8';ctx.beginPath();ctx.arc(0,h-34,9,0,7);ctx.fill();
  ctx.fillStyle='#f0c49a';ctx.beginPath();ctx.arc(9,h-34,2.1,0,7);ctx.fill();   // ear
  // hair peeking from under the cap (sides/back)
  ctx.fillStyle='#5a3a1a';
  ctx.fillRect(-9,h-36,2.4,6);                                                  // back sideburn
  ctx.beginPath();ctx.arc(6.5,h-31,2.2,Math.PI*1.1,Math.PI*1.9);ctx.fill();     // wisp near front

  // FACE (faces +x)
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(3,h-35,2.5,3,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(7.5,h-35,2.1,2.7,0,0,7);ctx.fill();
  ctx.fillStyle='#3a2a17';
  ctx.beginPath();ctx.arc(3.6,h-35,1.3,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(7.8,h-35,1.2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(3.1,h-35.6,0.5,0,7);ctx.fill();  // eye glint
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=1;ctx.lineCap='round';                // brows
  ctx.beginPath();ctx.moveTo(1.4,h-38.4);ctx.lineTo(5,h-38.8);ctx.moveTo(6.2,h-38.6);ctx.lineTo(9,h-38.2);ctx.stroke();
  ctx.fillStyle='#eab48a';ctx.beginPath();ctx.arc(6.2,h-32,1.1,0,7);ctx.fill(); // nose
  ctx.strokeStyle='#9c4a2a';ctx.lineWidth=1.4;                                  // smile
  ctx.beginPath();ctx.arc(4.5,h-31,3.1,0.12*Math.PI,0.78*Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(255,120,120,.4)';ctx.beginPath();ctx.arc(2.3,h-31,1.8,0,7);ctx.fill(); // cheek

  // BASEBALL CAP
  ctx.fillStyle='#049CD8';
  ctx.beginPath();ctx.arc(0,h-37,10,Math.PI,2*Math.PI);ctx.closePath();ctx.fill();   // crown
  ctx.fillStyle='#0a5e96';                                                            // crown shade
  ctx.beginPath();ctx.arc(0,h-37,10,Math.PI*1.5,Math.PI*2);ctx.lineTo(0,h-37);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;                              // seams
  ctx.beginPath();ctx.moveTo(0,h-47);ctx.lineTo(0,h-37);ctx.moveTo(-5,h-45.5);ctx.lineTo(-3,h-37);ctx.moveTo(5,h-45.5);ctx.lineTo(3,h-37);ctx.stroke();
  ctx.fillStyle='#0d6fb0';                                                             // brim forward (+x)
  ctx.beginPath();ctx.moveTo(1,h-37);ctx.quadraticCurveTo(19,h-39.5,20,h-35.5);
  ctx.quadraticCurveTo(18,h-33,1,h-34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#FBD000';ctx.beginPath();ctx.arc(0,h-46.5,1.9,0,7);ctx.fill();        // button
  ctx.restore();
}

/* ---------- CELEBRATION ---------- */
let parts=[],balloons=[],plane=null,candleLit=true,smoke=[],promptPulse=0;
function startCelebration(){
  parts=[];balloons=[];smoke=[];candleLit=true;plane={x:-200,y:120};
  for(let i=0;i<14;i++)balloons.push({x:Math.random()*W,y:H+Math.random()*300,
    r:14+Math.random()*10,c:PCOL[i%5],sp:0.8+Math.random()*1.4,sw:Math.random()*6.28});
}
function firework(x,y){const col=PCOL[Math.floor(Math.random()*5)];
  for(let i=0;i<26;i++){const a=(i/26)*6.28,sp=1.5+Math.random()*2.5;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:60,c:col});}}
// big celebration cake (center of screen)
const bigCake={x:W/2,y:330,w:150,h:96};
function blowCandle(){
  if(state!=='win'||!candleLit)return;
  candleLit=false;blowSound();
  for(let i=0;i<5;i++)smoke.push({x:bigCake.x,y:bigCake.y-bigCake.h/2-44,vy:-0.5-Math.random(),vx:(Math.random()-0.5)*0.6,life:70,r:4});
  // celebratory bursts on blow-out
  for(let k=0;k<4;k++)setTimeout(()=>firework(80+Math.random()*300,90+Math.random()*220),k*120);
  document.getElementById('playAgain').classList.remove('hidden');
}
function updateCelebration(){
  promptPulse+=0.08;
  if(Math.random()<0.08)firework(60+Math.random()*340,80+Math.random()*220);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;if(p.life<=0)parts.splice(i,1);}
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.x+=s.vx;s.y+=s.vy;s.r+=0.15;s.life--;if(s.life<=0)smoke.splice(i,1);}
  balloons.forEach(b=>{b.y-=b.sp;b.sw+=0.04;if(b.y<-40)b.y=H+30;});
  if(plane){plane.x+=2.2;if(plane.x>W+240)plane.x=-280;}
}
function drawBigCake(){
  const cx=bigCake.x, baseY=bigCake.y, w=bigCake.w, h=bigCake.h;
  const x=cx-w/2, y=baseY-h;
  // plate
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(cx,baseY+6,w*0.62,12,0,0,7);ctx.fill();
  // tiers
  ctx.fillStyle='#c97b3c';rrect(x,y+h*0.45,w,h*0.55,10);ctx.fill();          // bottom sponge
  ctx.fillStyle='#fff';rrect(x,y+h*0.45,w,14,8);ctx.fill();                   // cream
  ctx.fillStyle='#E52521';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(x+16+i*19,y+h*0.45+14,6,0,7);ctx.fill();} // drips
  ctx.fillStyle='#d98a4a';rrect(x+18,y+6,w-36,h*0.45,10);ctx.fill();          // top tier
  ctx.fillStyle='#fff';rrect(x+18,y+6,w-36,12,8);ctx.fill();
  ctx.fillStyle='#FBD000';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(x+30+i*22,y+6+12,4,0,7);ctx.fill();}
  // candle
  const candX=cx, candTop=y-30;
  ctx.fillStyle='#E52521';ctx.fillRect(candX-4,candTop,8,38);
  ctx.fillStyle='#fff';ctx.fillRect(candX-4,candTop+8,8,5);ctx.fillRect(candX-4,candTop+20,8,5);
  if(candleLit){
    const fl=Math.sin(Date.now()/90)*2;
    ctx.fillStyle='#FF8C00';ctx.beginPath();ctx.ellipse(candX+fl,candTop-12,6,13,0,0,7);ctx.fill();
    ctx.fillStyle='#FBD000';ctx.beginPath();ctx.ellipse(candX+fl,candTop-9,3,7,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(candX+fl,candTop-7,1.4,3,0,0,7);ctx.fill();
    // glow
    ctx.globalAlpha=0.25;ctx.fillStyle='#FBD000';ctx.beginPath();ctx.arc(candX,candTop-10,22,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  // smoke wisps after blow
  smoke.forEach(s=>{ctx.globalAlpha=Math.max(0,s.life/70)*0.5;ctx.fillStyle='#ddd';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});ctx.globalAlpha=1;
}
function drawCelebration(){
  balloons.forEach(b=>{const dx=Math.sin(b.sw)*10;
    ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(b.x+dx,b.y,b.r,b.r*1.15,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(b.x+dx,b.y+b.r*1.15);ctx.lineTo(b.x+dx,b.y+b.r*1.15+24);ctx.stroke();});
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/60);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();});ctx.globalAlpha=1;
  // plane + Hebrew banner
  if(plane){const px=plane.x,py=plane.y;
    ctx.fillStyle='#fff';rrect(px-205,py-22,185,44,8);ctx.fill();
    ctx.strokeStyle='#E52521';ctx.lineWidth=3;rrect(px-205,py-22,185,44,8);ctx.stroke();
    ctx.textAlign='center';ctx.direction='rtl';
    ctx.fillStyle='#049CD8';ctx.font='bold 16px "Arial Hebrew",Arial,sans-serif';ctx.fillText('יום הולדת שמח',px-112,py-3);
    ctx.fillStyle='#E52521';ctx.fillText('גור!!!',px-112,py+16);
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px-20,py);ctx.lineTo(px+6,py-2);ctx.stroke();
    ctx.fillStyle='#FBD000';ctx.beginPath();ctx.ellipse(px+24,py-4,26,11,0,0,7);ctx.fill();
    ctx.fillStyle='#E52521';ctx.beginPath();ctx.moveTo(px+10,py-4);ctx.lineTo(px-2,py-20);ctx.lineTo(px+6,py-4);ctx.fill();
    ctx.fillStyle='#049CD8';ctx.beginPath();ctx.arc(px+34,py-6,4,0,7);ctx.fill();
    ctx.strokeStyle='#3a2200';ctx.lineWidth=3;const pr=Date.now()/40;
    ctx.beginPath();ctx.moveTo(px+50,py-4-Math.cos(pr)*9);ctx.lineTo(px+50,py-4+Math.cos(pr)*9);ctx.stroke();
  }
  drawBigCake();
  // centered Hebrew message
  ctx.textAlign='center';ctx.direction='rtl';
  if(candleLit){
    const s=1+Math.sin(promptPulse)*0.05;
    ctx.save();ctx.translate(W/2,540);ctx.scale(s,s);
    ctx.font='bold 26px "Arial Hebrew",Arial,sans-serif';ctx.lineWidth=5;ctx.strokeStyle='#1a3c8c';
    ctx.strokeText('הקישו כדי לכבות את הנר 🎂',0,0);
    ctx.fillStyle='#fff';ctx.fillText('הקישו כדי לכבות את הנר 🎂',0,0);
    ctx.restore();
  }else{
    ctx.font='bold 40px "Arial Hebrew",Arial,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='#1a3c8c';
    ctx.strokeText('יום הולדת שמח',W/2,540);
    ctx.fillStyle='#FBD000';ctx.fillText('יום הולדת שמח',W/2,540);
    ctx.strokeText('גור! 🎉',W/2,584);
    ctx.fillStyle='#E52521';ctx.fillText('גור! 🎉',W/2,584);
  }
}

/* ---------- LOOP ---------- */
function drawFloats(){
  ctx.textAlign='center';ctx.font='bold 16px "Arial Hebrew",Arial,sans-serif';
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,f.life/50);
    ctx.fillStyle='#fff';ctx.strokeStyle='#ff7ad9';ctx.lineWidth=3;
    ctx.strokeText(f.txt,f.x,f.y);ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(state==='play'||state==='over'){drawPlatforms();drawCoins();drawCake();presents.forEach(drawPresent);drawKid();drawFloats();}
  if(state==='win')drawCelebration();
}
function loop(){
  if(state==='play')update();
  if(state==='win')updateCelebration();
  for(let i=floats.length-1;i>=0;i--){floats[i].y-=0.8;floats[i].life--;if(floats[i].life<=0)floats.splice(i,1);}
  render();raf=requestAnimationFrame(loop);
}

/* ---------- STATE ---------- */
const touchEl=document.getElementById('touch');
function startGame(){
  initAudio();
  lives=3;updateHUD();presents=[];floats=[];spawnTimer=50;resetPlayer();initCoins();state='play';
  document.getElementById('timer').textContent='🎂 הגיעו לעוגה!';
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById('win').classList.add('hidden');
  document.getElementById('playAgain').classList.add('hidden');
  touchEl.classList.remove('hidden');     // show controls during play
}
function gameOver(){state='over';touchEl.classList.add('hidden');
  document.getElementById('over').classList.remove('hidden');}
function winGame(){if(state==='win')return;state='win';touchEl.classList.add('hidden');
  startCelebration();playHappyBirthday();
  document.getElementById('win').classList.remove('hidden');
  document.getElementById('timer').textContent='🎉 הצלחתם!';}

/* ---------- Happy Birthday melody (public-domain tune, tones only) ---------- */
function playHappyBirthday(){
  if(!audioCtx)return;
  const beat=0.40, t0=audioCtx.currentTime+0.25;
  const G4=392,A4=440,B4=494,C5=523,D5=587,E5=659,F5=698,G5=784;
  const song=[
    [G4,.5],[G4,.5],[A4,1],[G4,1],[C5,1],[B4,2],
    [G4,.5],[G4,.5],[A4,1],[G4,1],[D5,1],[C5,2],
    [G4,.5],[G4,.5],[G5,1],[E5,1],[C5,1],[B4,1],[A4,2],
    [F5,.5],[F5,.5],[E5,1],[C5,1],[D5,1],[C5,2.5]
  ];
  let t=t0;
  for(const [f,b] of song){
    const dur=b*beat;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.22,t+0.04);
    g.gain.setValueAtTime(0.22,t+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.98);
    o.start(t);o.stop(t+dur);
    // soft harmony a third below for warmth
    const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
    o2.type='sine';o2.frequency.value=f*0.8;o2.connect(g2);g2.connect(audioCtx.destination);
    g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.07,t+0.04);
    g2.gain.exponentialRampToValueAtTime(0.001,t+dur*0.98);
    o2.start(t);o2.stop(t+dur);
    t+=dur;
  }
}

/* ---------- Fullscreen toggle (with iOS fallback) ---------- */
const wrap=document.getElementById('wrap'),fsBtn=document.getElementById('fsBtn');
const fsSupported=!!(wrap.requestFullscreen||wrap.webkitRequestFullscreen);
fsBtn.onclick=()=>{
  initAudio();
  if(!fsSupported){ // iPhone Safari: no element fullscreen — guide to Home Screen
    fsBtn.textContent='הקישו ⤴ ← "הוסף למסך הבית"';
    setTimeout(()=>{fsBtn.textContent='⛶ מסך מלא';},3500);
    return;
  }
  const fsEl=document.fullscreenElement||document.webkitFullscreenElement;
  if(!fsEl){ (wrap.requestFullscreen||wrap.webkitRequestFullscreen).call(wrap); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
};
document.addEventListener('fullscreenchange',()=>{
  fsBtn.textContent=document.fullscreenElement?'⛶ יציאה':'⛶ מסך מלא';
});

/* tap anywhere on the play area to blow out the candle */
cv.addEventListener('pointerdown',e=>{e.preventDefault();blowCandle();});

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('playAgain').onclick=startGame;
loop();
</script>
